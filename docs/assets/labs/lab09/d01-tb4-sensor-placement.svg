<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
  <title id="t">Where the TurtleBot 4 sensors are, side view</title>
  <desc id="d">Side view of the simulated TurtleBot 4 facing right, drawn to scale. The lidar scans a horizontal plane 0.19 metres above the floor and measures 0.164 to 12 metres. The OAK-D depth camera is mounted 0.24 metres above the floor and looks straight ahead; it gives no depth readings closer than 0.3 metres. The color webcam added for this lab is mounted at the front of the top plate, 0.37 metres above the floor and tilted 26 degrees down; on level ground its view reaches the floor about 0.2 metres ahead of the bumper. The IR sensors on the front of the bumper see objects within about 0.2 metres of it, and the cliff sensors under the front of the bumper look down at the floor. The bumper front is 0.17 metres ahead of the robot center. An 8 centimetre box from lane A is drawn ahead of the robot for scale; its top is below the lidar plane.</desc>

  <style>
    .hd     { font-family: "Segoe UI", Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #012169; }
    .lbl    { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #26313f; }
    .num    { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #26313f; }
    .note   { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #5a6675; }
    .lid    { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f766e; }
    .cam    { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #012169; }
    .web    { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #6b21a8; }
    .wax    { stroke: #6b21a8; stroke-width: 1.6; stroke-dasharray: 7 4; }
    .wedge  { stroke: #6b21a8; stroke-width: 1.2; }
    .irl    { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #a32e22; }
    .plane  { stroke: #0f766e; stroke-width: 1.8; stroke-dasharray: 7 4; }
    .axis   { stroke: #012169; stroke-width: 1.6; stroke-dasharray: 7 4; }
    .edge   { stroke: #012169; stroke-width: 1.2; }
    .near   { stroke: #012169; stroke-width: 1.6; stroke-dasharray: 3 3; }
    .ir     { stroke: #a32e22; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .dim    { stroke: #5a6675; stroke-width: 1.2; }
    .ext    { stroke: #9aa4b2; stroke-width: 1; }
    .guide  { stroke: #9aa4b2; stroke-width: 1; stroke-dasharray: 2 3; }
    .body   { fill: #d9dde3; stroke: #8d97a5; stroke-width: 1.2; }
    .bump   { fill: #8d97a5; stroke: #5a6675; stroke-width: 1.2; }
    .plate  { fill: #9aa4b2; }
    .dark   { fill: #26313f; }
    .box    { fill: #e6801a; stroke: #9a5410; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6675"/>
    </marker>
    <marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#012169"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#ffffff"/>

  <!-- Scale: 600 px per metre. Floor at y = 360, robot center at x = 250.
       Lidar plane z 0.193 -> y 244.2; camera z 0.244 -> y 213.6 at x = -0.06 m (px 214). -->
  <text class="hd" x="30" y="32">TurtleBot 4 sensors, side view (simulation, to scale)</text>
  <line x1="760" y1="52" x2="840" y2="52" stroke="#012169" stroke-width="2" marker-end="url(#fw)"/>
  <text class="cam" x="760" y="44">robot faces +x</text>

  <!-- camera view: shaded zone with no depth readings (camera to 0.3 m) -->
  <polygon points="214,213.6 394,116.2 394,311 " fill="#e8eef8"/>

  <!-- lidar scan plane, both directions -->
  <line class="plane" x1="30" y1="244.2" x2="880" y2="244.2"/>
  <!-- camera height guide -->
  <line class="guide" x1="30" y1="213.6" x2="190" y2="213.6"/>
  <text class="num" x="30" y="238" style="fill:#0f766e">0.19 m</text>
  <text class="num" x="30" y="207" style="fill:#012169">0.24 m</text>

  <!-- floor -->
  <rect x="20" y="360" width="870" height="12" fill="#ece5d6"/>
  <line x1="20" y1="360" x2="890" y2="360" stroke="#9a8f78" stroke-width="1.5"/>

  <!-- robot: Create 3 base, bumper, wheel, plate -->
  <rect class="body" x="147.4" y="303" width="205.2" height="52" rx="14"/>
  <path class="bump" d="M 276 303 L 338.6 303 Q 352.6 303 352.6 317 L 352.6 341 Q 352.6 355 338.6 355 L 276 355 Z"/>
  <text x="314" y="333" text-anchor="middle" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff;">bumper</text>
  <circle cx="250" cy="338.4" r="21.6" fill="#3d4756"/>
  <circle cx="250" cy="338.4" r="6" fill="#9aa4b2"/>
  <rect class="plate" x="152" y="297" width="196" height="6"/>

  <!-- tower: standoffs and top plate (z = 0.347 m) -->
  <rect x="202.9" y="151.9" width="3" height="145.1" fill="#c3cad4"/>
  <rect x="266.9" y="151.9" width="3" height="145.1" fill="#c3cad4"/>
  <rect class="plate" x="154" y="147.9" width="192" height="4"/>

  <!-- lidar on its mount, x = -0.04 m -->
  <rect class="plate" x="220" y="270" width="12" height="27"/>
  <rect class="dark" x="205" y="237" width="42" height="33" rx="4"/>
  <line x1="205" y1="244.2" x2="247" y2="244.2" stroke="#2dd4bf" stroke-width="2.2"/>
  <text class="lid" x="182" y="262" text-anchor="end">lidar</text>

  <!-- camera on its post, optical center x = -0.06 m, z = 0.244 m -->
  <rect class="plate" x="186" y="222" width="8" height="75"/>
  <rect x="190" y="204" width="24" height="19" rx="3" fill="#012169"/>
  <circle cx="214" cy="213.6" r="3.2" fill="#ffffff" stroke="#012169" stroke-width="1.2"/>
  <text class="cam" x="182" y="200" text-anchor="end">OAK-D</text>

  <!-- camera axis and view edges -->
  <line class="axis" x1="217" y1="213.6" x2="880" y2="213.6"/>
  <line class="edge" x1="214" y1="213.6" x2="394" y2="116.2"/>
  <line class="edge" x1="214" y1="213.6" x2="484.6" y2="360"/>
  <!-- depth near limit, 0.3 m ahead of the camera -->
  <line class="near" x1="394" y1="116.2" x2="394" y2="311"/>
  <line class="ext" x1="214" y1="200" x2="214" y2="94"/>
  <line class="ext" x1="394" y1="112" x2="394" y2="94"/>
  <line class="dim" x1="214" y1="100" x2="394" y2="100" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="num" x="304" y="93" text-anchor="middle">0.3 m</text>
  <text class="cam" x="402" y="112">depth: no readings closer than 0.3 m to the camera</text>

  <text class="cam" x="500" y="206">OAK-D (depth) looks straight ahead</text>
  <!-- webcam on a clip at the front of the top plate, optical center x = 0.10 m, z = 0.373 m, 25.8 deg down -->
  <rect class="dark" x="301.0" y="140.9" width="18" height="7"/>
  <g transform="rotate(25.8 310.0 136.2)">
    <rect x="294.4" y="127.8" width="15.6" height="16.8" rx="4" fill="#6b21a8"/>
    <rect x="310.0" y="131.2" width="2.5" height="10" fill="#26313f"/>
  </g>
  <line class="guide" x1="30" y1="136.2" x2="292.0" y2="136.2"/>
  <text class="num" x="30" y="130.2" style="fill:#6b21a8">0.37 m</text>
  <text class="web" x="288.0" y="122.2" text-anchor="end">webcam</text>
  <line class="wax" x1="310.0" y1="136.2" x2="773.0" y2="360"/>
  <line class="wedge" x1="310.0" y1="136.2" x2="479.3" y2="360"/>
  <line class="wedge" x1="310.0" y1="136.2" x2="880" y2="122.3"/>
  <text class="web" x="560" y="168">webcam (color) tilted 26&#176; down;</text>
  <text class="web" x="560" y="184">nearest floor it sees: about 0.2 m ahead of the bumper</text>
  <text class="lid" x="500" y="237">lidar scan plane, measures 0.164 to 12 m</text>

  <!-- IR: emitters on the bumper front, about 0.2 m reach -->
  <circle cx="352.6" cy="330" r="3" fill="#a32e22"/>
  <line class="ir" x1="355" y1="330" x2="472.6" y2="318"/>
  <line class="ir" x1="355" y1="330" x2="472.6" y2="330"/>
  <line class="ir" x1="355" y1="330" x2="472.6" y2="342"/>

  <!-- cliff sensor: under the front of the bumper, looking down -->
  <rect x="336" y="353" width="8" height="4" fill="#a32e22"/>
  <line x1="340" y1="357" x2="340" y2="360" stroke="#a32e22" stroke-width="1.5"/>

  <!-- box from lane A, 8 cm tall, drawn at an example distance -->
  <rect class="box" x="640" y="312" width="180" height="48"/>
  <text class="lbl" x="730" y="302" text-anchor="middle">box from lane A</text>
  <line class="dim" x1="836" y1="312" x2="836" y2="360" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line class="ext" x1="822" y1="312" x2="842" y2="312"/>
  <text class="num" x="844" y="340">8 cm</text>

  <!-- dimensions under the floor -->
  <line class="ext" x1="250" y1="372" x2="250" y2="396"/>
  <line class="ext" x1="352.6" y1="372" x2="352.6" y2="396"/>
  <line class="ext" x1="472.6" y1="372" x2="472.6" y2="396"/>
  <line class="dim" x1="250" y1="390" x2="352.6" y2="390" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line class="dim" x1="352.6" y1="390" x2="472.6" y2="390" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="num" x="301" y="408" text-anchor="middle">0.17 m</text>
  <text class="irl" x="412" y="408" text-anchor="middle">IR: about 0.2 m</text>
  <text class="lbl" x="250" y="424" text-anchor="middle">robot center</text>
  <line class="ext" x1="340" y1="361" x2="340" y2="430" style="stroke:#a32e22"/>
  <text class="irl" x="346" y="434">cliff sensors under the bumper look down at the floor</text>

  <!-- notes -->
  <line x1="30" y1="446" x2="870" y2="446" stroke="#cdd6e4" stroke-width="1.5"/>
  <text class="note" x="30" y="468">Heights and distances are to scale; the robot outline is simplified. The box is drawn at an example distance.</text>
</svg>
