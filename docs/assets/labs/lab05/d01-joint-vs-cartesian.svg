<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t d">
  <title id="t">Joint-space planning compared with Cartesian planning</title>
  <desc id="d">Both plans start and end at the same two poses. A joint-space plan interpolates between joint angles, so the gripper sweeps a curved and hard to predict path through space, but the plan almost always succeeds. A Cartesian plan forces the gripper along a straight line, which is what you want near an object, but it can fail: if the planner cannot follow enough of the line it returns a fraction below the threshold and gives you nothing.</desc>

  <style>
    .panel { fill: #f8fafc; stroke: #cdd6e4; stroke-width: 1.5; }
    .hd    { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #012169; }
    .hdt   { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0f766e; }
    .link  { stroke: #012169; stroke-width: 5; stroke-linecap: round; fill: none; }
    .linkg { stroke: #aab4c2; stroke-width: 5; stroke-linecap: round; fill: none; }
    .joint { fill: #ffffff; stroke: #012169; stroke-width: 2; }
    .jointg{ fill: #ffffff; stroke: #aab4c2; stroke-width: 2; }
    .path  { fill: none; stroke: #c2410c; stroke-width: 2.6; stroke-dasharray: 6 4; }
    .pathc { fill: none; stroke: #0f766e; stroke-width: 2.6; stroke-dasharray: 6 4; }
    .pt    { fill: #26313f; }
    .lbl   { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #26313f; font-weight: 600; }
    .sub   { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #5a6675; }
    .mono  { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; fill: #012169; font-weight: 700; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #5a6675; }
    .good  { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #0f766e; font-weight: 600; }
    .bad   { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #a32e22; font-weight: 600; }
  </style>

  <rect width="860" height="430" fill="#ffffff"/>

  <!-- ============ LEFT : joint space ============ -->
  <rect class="panel" x="24" y="20" width="390" height="256" rx="10"/>
  <text class="hd"  x="46" y="48">Joint space</text>
  <text class="sub" x="46" y="68">move_to_configuration — interpolates the six joint angles</text>

  <!-- start arm (grey) -->
  <g>
    <line class="linkg" x1="80" y1="230" x2="130" y2="160"/>
    <line class="linkg" x1="130" y1="160" x2="196" y2="150"/>
    <circle class="jointg" cx="80"  cy="230" r="6"/>
    <circle class="jointg" cx="130" cy="160" r="6"/>
  </g>
  <!-- goal arm (blue) -->
  <g>
    <line class="link" x1="80" y1="230" x2="152" y2="196"/>
    <line class="link" x1="152" y1="196" x2="214" y2="232"/>
    <circle class="joint" cx="80"  cy="230" r="6"/>
    <circle class="joint" cx="152" cy="196" r="6"/>
  </g>

  <circle class="pt" cx="196" cy="150" r="5"/>
  <circle class="pt" cx="214" cy="232" r="5"/>
  <text class="lbl" x="206" y="142">start</text>
  <text class="lbl" x="224" y="238">goal</text>

  <!-- swept EE path : bulges outward -->
  <path class="path" d="M 196 150 C 250 150, 288 190, 214 232"/>
  <text class="lbl" x="292" y="186" style="fill:#c2410c">gripper path</text>
  <text class="sub" x="292" y="202">curved, hard to predict</text>

  <text class="good" x="46" y="256">Almost always finds a plan.</text>

  <!-- ============ RIGHT : cartesian ============ -->
  <rect class="panel" x="446" y="20" width="390" height="256" rx="10"/>
  <text class="hdt" x="468" y="48">Cartesian</text>
  <text class="sub" x="468" y="68">plan(cartesian=True) — forces a straight line in space</text>

  <g>
    <line class="linkg" x1="502" y1="230" x2="552" y2="160"/>
    <line class="linkg" x1="552" y1="160" x2="618" y2="150"/>
    <circle class="jointg" cx="502" cy="230" r="6"/>
    <circle class="jointg" cx="552" cy="160" r="6"/>
  </g>
  <g>
    <line class="link" x1="502" y1="230" x2="574" y2="196"/>
    <line class="link" x1="574" y1="196" x2="636" y2="232"/>
    <circle class="joint" cx="502" cy="230" r="6"/>
    <circle class="joint" cx="574" cy="196" r="6"/>
  </g>

  <circle class="pt" cx="618" cy="150" r="5"/>
  <circle class="pt" cx="636" cy="232" r="5"/>
  <text class="lbl" x="628" y="142">start</text>
  <text class="lbl" x="646" y="238">goal</text>

  <path class="pathc" d="M 618 150 L 636 232"/>
  <text class="lbl" x="700" y="186" style="fill:#0f766e">gripper path</text>
  <text class="sub" x="700" y="202">straight, predictable</text>

  <text class="bad" x="468" y="256">Can fail and return nothing.</text>

  <!-- ============ notes ============ -->
  <line x1="24" y1="306" x2="836" y2="306" stroke="#cdd6e4" stroke-width="1.5"/>

  <text class="note" x="24" y="332">Use Cartesian motion when the shape of the path matters: descending onto a block, or lifting straight up out of a stack.</text>
  <text class="note" x="24" y="352">Use joint-space motion for the long transit moves in between, where only the destination matters.</text>

  <text class="note" x="24" y="384"><tspan style="font-weight:700;fill:#a32e22">The common failure.</tspan> A Cartesian plan reports what fraction of the line it managed to follow. If that falls below</text>
  <text class="note" x="24" y="404">the threshold, <tspan class="mono">plan()</tspan> returns <tspan class="mono">None</tspan>, so check for <tspan class="mono">None</tspan> before executing, or the crash comes from inside <tspan class="mono">execute()</tspan>.</text>
</svg>
