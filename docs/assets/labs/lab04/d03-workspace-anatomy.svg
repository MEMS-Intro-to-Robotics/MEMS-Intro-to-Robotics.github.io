<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">What each directory in a colcon workspace is for</title>
  <desc id="d">A colcon workspace has four directories. You write code only in src. Running colcon build from the workspace root generates build, install, and log. Sourcing install slash setup dot bash is what makes ros2 run able to find your package. The three generated directories must never be committed to git.</desc>

  <style>
    .yours { fill: #eefaf7; stroke: #0f766e; stroke-width: 2.2; }
    .gen   { fill: #f4f7fc; stroke: #9aa4b2; stroke-width: 1.8; }
    .root  { fill: #ffffff; stroke: #012169; stroke-width: 2.2; }
    .dir   { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #012169; }
    .dirg  { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #5a6675; }
    .role  { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #5a6675; }
    .tagy  { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f766e; }
    .tagg  { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #8a5a10; }
    .tree  { stroke: #cdd6e4; stroke-width: 1.6; fill: none; }
    .cmd   { stroke: #0f766e; stroke-width: 2.2; fill: none; marker-end: url(#a); }
    .cmdl  { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #0f766e; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #5a6675; }
    .mono  { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #012169; font-weight: 700; }
    .hd    { font-family: "Segoe UI", Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #012169; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <text class="hd" x="40" y="30">You write in one of these; colcon writes the other three</text>

  <!-- workspace root -->
  <rect class="root" x="40" y="48" width="180" height="46" rx="6"/>
  <text class="dir"  x="130" y="70" text-anchor="middle">ros2_ws/</text>
  <text class="role" x="130" y="86" text-anchor="middle">run colcon build from here</text>

  <!-- tree spine -->
  <path class="tree" d="M 70 94 L 70 320"/>
  <path class="tree" d="M 70 132 L 104 132"/>
  <path class="tree" d="M 70 194 L 104 194"/>
  <path class="tree" d="M 70 250 L 104 250"/>
  <path class="tree" d="M 70 306 L 104 306"/>

  <!-- src -->
  <rect class="yours" x="108" y="110" width="300" height="46" rx="6"/>
  <text class="dir"  x="126" y="132">src/</text>
  <text class="role" x="186" y="132">your packages — the only thing you edit</text>
  <text class="tagy" x="126" y="150">tracked by git</text>

  <!-- build -->
  <rect class="gen" x="108" y="172" width="300" height="44" rx="6"/>
  <text class="dirg" x="126" y="194">build/</text>
  <text class="role" x="196" y="194">intermediate compilation artifacts</text>
  <text class="tagg" x="126" y="210">generated · never commit</text>

  <!-- install -->
  <rect class="gen" x="108" y="228" width="300" height="44" rx="6"/>
  <text class="dirg" x="126" y="250">install/</text>
  <text class="role" x="204" y="250">what you source; where ros2 run looks</text>
  <text class="tagg" x="126" y="266">generated · never commit</text>

  <!-- log -->
  <rect class="gen" x="108" y="284" width="300" height="44" rx="6"/>
  <text class="dirg" x="126" y="306">log/</text>
  <text class="role" x="180" y="306">build output — read this when a build fails</text>
  <text class="tagg" x="126" y="322">generated · never commit</text>

  <!-- flow arrows -->
  <path class="cmd" d="M 412 133 C 470 133, 470 194, 556 194"/>
  <text class="cmdl" x="484" y="150" text-anchor="middle">colcon build</text>

  <path class="cmd" d="M 412 250 C 470 250, 470 268, 556 268"/>
  <text class="cmdl" x="484" y="232" text-anchor="middle">source</text>
  <text class="cmdl" x="484" y="248" text-anchor="middle">install/setup.bash</text>

  <!-- outcomes -->
  <rect class="gen" x="560" y="172" width="300" height="44" rx="6"/>
  <text class="role" x="578" y="190">reads every package under <tspan class="mono">src/</tspan> and</text>
  <text class="role" x="578" y="208">writes the other three directories</text>

  <rect class="yours" x="560" y="246" width="300" height="44" rx="6"/>
  <text class="role" x="578" y="264">puts your executables on the path, so</text>
  <text class="role" x="578" y="282"><tspan class="mono">ros2 run</tspan> can finally find them</text>

  <!-- notes -->
  <line x1="40" y1="344" x2="840" y2="344" stroke="#cdd6e4" stroke-width="1.5"/>
  <text class="note" x="40" y="370">Committing <tspan class="mono">build/</tspan>, <tspan class="mono">install/</tspan>, or <tspan class="mono">log/</tspan> is the most common submission mistake in this course. They are machine-specific,</text>
  <text class="note" x="40" y="390">they are large, and the <tspan class="mono">.gitignore</tspan> in your starter already excludes them, so do not add them back with <tspan class="mono">git add -A</tspan>.</text>
</svg>
