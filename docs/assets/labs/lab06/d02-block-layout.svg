<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d">
  <title id="t">Lab 6 block positions and working heights</title>
  <desc id="d">Top view: a quick mount holds the arm base on a square plate. Three 50 millimetre blocks sit in a row at x equals 0.44 metres: block_1, red, at y equals minus 0.168; block_2, blue, at y equals 0.012; block_3, yellow, at y equals 0.192. The tower is built on block_2. Side view: base_link is at the top of the quick mount; the tabletop is at z equals minus 0.0627 metres; GRASP_HEIGHT is 0.119 metres and APPROACH_HEIGHT is 0.274 metres, both measured at end_effector_link. At GRASP_HEIGHT the fingertips are level with the middle of a block on the table.</desc>

  <style>
    .hd     { font-family: "Segoe UI", Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #012169; }
    .ax     { stroke: #26313f; stroke-width: 1.6; }
    .axl    { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; fill: #5a6675; }
    .red    { fill: #d64545; stroke: #8f2020; stroke-width: 1.5; }
    .blue   { fill: #3b76c4; stroke: #1d4a8a; stroke-width: 1.5; }
    .yellow { fill: #e0b03c; stroke: #9a761d; stroke-width: 1.5; }
    .plate  { fill: #d9dde3; stroke: #9aa4b2; stroke-width: 1.2; }
    .mount  { fill: #26313f; }
    .table  { fill: #ecd9b8; stroke: #c4a676; stroke-width: 1.2; }
    .idlbl  { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #012169; }
    .coord  { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #5a6675; }
    .bl     { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #26313f; }
    .hgt    { stroke: #0f766e; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .hgtl   { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #0f766e; }
    .gr     { fill: none; stroke: #0f766e; stroke-width: 2.4; }
    .tower  { fill: none; stroke: #012169; stroke-width: 1.4; stroke-dasharray: 3 3; }
    .note   { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #3d4756; }
    .mono   { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #012169; font-weight: 700; }
  </style>

  <rect width="860" height="440" fill="#ffffff"/>

  <!-- ================= TOP VIEW (450 px per metre, origin at the arm's base) ================= -->
  <text class="hd" x="30" y="30">Top view, looking down (base_link, metres)</text>

  <!-- plate 0.3048 m square and quick mount 0.11 m square, centred on the base -->
  <rect class="plate" x="21.5" y="141.5" width="137" height="137"/>
  <rect class="mount" x="65.3" y="185.3" width="49.5" height="49.5" rx="4"/>
  <text class="bl" x="90" y="296" text-anchor="middle">plate and quick mount</text>

  <!-- axes -->
  <line class="ax" x1="90" y1="210" x2="262" y2="210"/>
  <line class="ax" x1="90" y1="210" x2="90" y2="70"/>
  <text class="axl" x="252" y="228" text-anchor="middle">+x</text>
  <text class="axl" x="90" y="62" text-anchor="middle">+y</text>

  <!-- blocks at x = 0.44 (288 px), 50 mm = 22.5 px -->
  <rect class="yellow" x="276.8" y="112.4" width="22.5" height="22.5" rx="2"/>
  <rect class="blue"   x="276.8" y="193.4" width="22.5" height="22.5" rx="2"/>
  <rect class="red"    x="276.8" y="274.4" width="22.5" height="22.5" rx="2"/>
  <rect class="tower"  x="271.8" y="188.4" width="32.5" height="32.5" rx="4"/>

  <text class="idlbl" x="312" y="121">block_3</text>
  <text class="coord" x="312" y="136">yellow, y = 0.192</text>
  <text class="idlbl" x="312" y="202">block_2</text>
  <text class="coord" x="312" y="217">blue, y = 0.012, tower base</text>
  <text class="idlbl" x="312" y="283">block_1</text>
  <text class="coord" x="312" y="298">red, y = −0.168</text>

  <!-- x dimension -->
  <line class="hgt" x1="90" y1="322" x2="288" y2="322"/>
  <line class="ax" x1="288" y1="316" x2="288" y2="328"/>
  <text class="hgtl" x="189" y="340" text-anchor="middle">x = 0.44</text>

  <!-- ================= SIDE VIEW (550 px per metre, z = 0 at base_link) ================= -->
  <text class="hd" x="530" y="30">Side view (base_link, metres)</text>

  <!-- table, plate, quick mount, arm base -->
  <rect class="table" x="470" y="244.5" width="370" height="12"/>
  <rect class="plate" x="476" y="237.5" width="168" height="7"/>
  <rect class="mount" x="530" y="210" width="60" height="27.5"/>
  <rect x="540" y="150" width="40" height="60" fill="#8d97a5"/>
  <text class="bl" x="586" y="184">arm base</text>

  <!-- z axis at x = 500 -->
  <line class="ax" x1="500" y1="262" x2="500" y2="48"/>
  <text class="axl" x="492" y="56" text-anchor="end">+z</text>
  <line class="ax" x1="494" y1="210" x2="506" y2="210"/>
  <text class="coord" x="600" y="226">base_link, z = 0</text>
  <text class="coord" x="660" y="275">tabletop, z = −0.0627</text>

  <!-- block on the table under the gripper, 50 mm = 27.5 px, centre x 802 -->
  <rect class="red" x="788.2" y="217" width="27.5" height="27.5" rx="2"/>

  <!-- working heights -->
  <line class="hgt" x1="500" y1="59.3" x2="840" y2="59.3"/>
  <text class="hgtl" x="608" y="53">APPROACH_HEIGHT = 0.274</text>
  <line class="hgt" x1="500" y1="144.6" x2="840" y2="144.6"/>
  <text class="hgtl" x="608" y="138">GRASP_HEIGHT = 0.119</text>

  <!-- gripper: end_effector_link at the palm line, fingertips 0.157 m (86 px) below -->
  <g class="gr" opacity="0.4">
    <line x1="786" y1="59.3" x2="818" y2="59.3"/>
    <line x1="786" y1="59.3" x2="786" y2="145.6"/>
    <line x1="818" y1="59.3" x2="818" y2="145.6"/>
  </g>
  <g class="gr">
    <line x1="782" y1="144.6" x2="822" y2="144.6"/>
    <line x1="786" y1="144.6" x2="786" y2="230.8"/>
    <line x1="818" y1="144.6" x2="818" y2="230.8"/>
  </g>

  <!-- ================= NOTES ================= -->
  <line x1="30" y1="362" x2="830" y2="362" stroke="#cdd6e4" stroke-width="1.5"/>
  <text class="note" x="30" y="386"><tspan class="mono">BLOCKS</tspan> in <tspan class="mono">blocks.py</tspan> defines these positions. Milestones 2 and 3 stack <tspan class="mono">block_1</tspan>, then <tspan class="mono">block_3</tspan>, on <tspan class="mono">block_2</tspan> in place.</text>
  <text class="note" x="30" y="408"><tspan class="mono">GRASP_HEIGHT</tspan> and <tspan class="mono">APPROACH_HEIGHT</tspan> specify the height of <tspan class="mono">end_effector_link</tspan> above the base.</text>
  <text class="note" x="30" y="428">At <tspan class="mono">GRASP_HEIGHT</tspan> the fingertips are level with the middle of a block on the table.</text>
</svg>
