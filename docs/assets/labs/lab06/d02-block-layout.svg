<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d">
  <title id="t">Block positions and the working heights above them</title>
  <desc id="d">Three blocks sit in a row in front of the robot, all at x equals zero point four five metres, spaced eight centimetres apart in y. Block one is the red block at y equals minus zero point zero eight, block two is blue on the zero line, and block three is yellow at y equals plus zero point zero eight. The side view shows the two working heights: the grasp height of zero point one nine metres and the approach height of zero point three two metres, both measured to the end effector frame rather than to the block.</desc>

  <style>
    .hd     { font-family: "Segoe UI", Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #012169; }
    .ax     { stroke: #26313f; stroke-width: 1.6; }
    .guide  { stroke: #9aa4b2; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .axl    { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; fill: #5a6675; }
    .red    { fill: #d64545; stroke: #8f2020; stroke-width: 1.5; }
    .blue   { fill: #3b76c4; stroke: #1d4a8a; stroke-width: 1.5; }
    .yellow { fill: #e0b03c; stroke: #9a761d; stroke-width: 1.5; }
    .idlbl  { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #012169; }
    .coord  { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #5a6675; }
    .base   { fill: #26313f; }
    .bl     { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #26313f; }
    .table  { fill: #eceff4; stroke: #b9c2ce; stroke-width: 1.5; }
    .hgt    { stroke: #0f766e; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .hgtl   { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #0f766e; }
    .gr     { fill: none; stroke: #0f766e; stroke-width: 2.4; }
    .note   { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #5a6675; }
    .mono   { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #012169; font-weight: 700; }
    .warn   { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #8a5a10; }
  </style>

  <rect width="860" height="470" fill="#ffffff"/>

  <!-- ================= TOP VIEW ================= -->
  <text class="hd" x="40" y="30">Top view — looking down at the table</text>

  <!-- axes: +x right, +y up, origin at the robot base -->
  <line class="ax" x1="70" y1="200" x2="250" y2="200"/>
  <line class="ax" x1="70" y1="200" x2="70"  y2="130"/>
  <text class="axl" x="246" y="190" text-anchor="end">+x</text>
  <text class="axl" x="70"  y="122" text-anchor="middle">+y</text>

  <!-- y = 0 continues through the middle block -->
  <line class="guide" x1="252" y1="200" x2="306" y2="200"/>

  <!-- robot base at the origin -->
  <circle class="base" cx="70" cy="200" r="9"/>
  <text class="bl"    x="70" y="226" text-anchor="middle">robot base</text>
  <text class="coord" x="70" y="242" text-anchor="middle">(0, 0)</text>

  <!-- blocks: y = +0.08 above the axis, 0.00 on it, -0.08 below -->
  <rect class="yellow" x="262" y="138" width="36" height="36" rx="3"/>
  <rect class="blue"   x="262" y="182" width="36" height="36" rx="3"/>
  <rect class="red"    x="262" y="226" width="36" height="36" rx="3"/>

  <text class="idlbl" x="312" y="152">block_3</text>
  <text class="coord" x="312" y="168">yellow · y = +0.08</text>

  <text class="idlbl" x="312" y="196">block_2</text>
  <text class="coord" x="312" y="212">blue · y = 0.00</text>

  <text class="idlbl" x="312" y="240">block_1</text>
  <text class="coord" x="312" y="256">red · y = −0.08</text>

  <!-- x dimension, clear of the blocks -->
  <line class="hgt" x1="70" y1="282" x2="280" y2="282"/>
  <text class="hgtl" x="175" y="300" text-anchor="middle">x = 0.45 m</text>

  <!-- ================= SIDE VIEW ================= -->
  <text class="hd" x="470" y="30">Side view — the two working heights</text>

  <line class="ax" x1="520" y1="250" x2="520" y2="60"/>
  <text class="axl" x="512" y="54" text-anchor="middle">+z</text>

  <!-- table -->
  <rect class="table" x="520" y="250" width="290" height="16"/>
  <text class="coord" x="665" y="286" text-anchor="middle">table surface, z ≈ 0</text>

  <!-- block resting on the table -->
  <rect class="red" x="719" y="228" width="22" height="22" rx="2"/>
  <text class="coord" x="705" y="244" text-anchor="end">block, 0.04 m tall</text>

  <!-- working heights -->
  <line class="hgt" x1="560" y1="96"  x2="810" y2="96"/>
  <text class="hgtl" x="564" y="90">approach_height = 0.32</text>

  <line class="hgt" x1="560" y1="160" x2="810" y2="160"/>
  <text class="hgtl" x="564" y="154">grasp_height = 0.19</text>

  <!-- gripper at each height -->
  <g class="gr" opacity="0.45">
    <line x1="730" y1="78" x2="730" y2="96"/>
    <line x1="720" y1="96" x2="740" y2="96"/>
    <line x1="720" y1="96" x2="720" y2="112"/>
    <line x1="740" y1="96" x2="740" y2="112"/>
  </g>
  <g class="gr">
    <line x1="730" y1="142" x2="730" y2="160"/>
    <line x1="720" y1="160" x2="740" y2="160"/>
    <line x1="720" y1="160" x2="720" y2="176"/>
    <line x1="740" y1="160" x2="740" y2="176"/>
  </g>

  <line class="hgt" x1="775" y1="96" x2="775" y2="160"/>
  <text class="hgtl" x="783" y="132">descend</text>

  <!-- ================= NOTES ================= -->
  <line x1="40" y1="326" x2="820" y2="326" stroke="#cdd6e4" stroke-width="1.5"/>

  <text class="note" x="40" y="352">The list <tspan class="mono">self.blocks_xyz</tspan> is numbered with <tspan class="mono">enumerate(..., start=1)</tspan>, so the first entry becomes <tspan class="mono">block_1</tspan>. That makes the</text>
  <text class="note" x="40" y="372">planning-scene ids line up with the Gazebo model names by position: <tspan class="mono">lab06_block_red</tspan> is <tspan class="mono">block_1</tspan>, blue is <tspan class="mono">block_2</tspan>, yellow is <tspan class="mono">block_3</tspan>.</text>

  <text class="warn" x="40" y="404">Both heights are measured to the <tspan style="font-weight:700">end-effector frame</tspan>, not to the block. That is why the grasp height is 0.19 m while the</text>
  <text class="warn" x="40" y="424">block centre sits near 0.02 m. The difference is the length of the gripper.</text>

  <text class="note" x="40" y="454">All three blocks share the same x and z. Only y changes, which is what makes the stacking loop straightforward to write.</text>
</svg>
