<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
  <title id="t">What attaching and detaching change in the planning scene</title>
  <desc id="d">The planner keeps two sets of objects: the robot, and the world. Before the grasp the block is in the world, so the planner treats touching it as a collision. Attaching moves the block from the world set into the robot set, so it now travels with the gripper and touching it is no longer a collision, while the planner still keeps it clear of the table. Detaching returns it to the world at its new location.</desc>

  <style>
    .panel { fill: #f8fafc; stroke: #cdd6e4; stroke-width: 1.5; }
    .hd    { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #012169; }
    .step  { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #0f766e; }
    .setl  { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #5a6675; }
    .robot { fill: #dbe4f2; stroke: #012169; stroke-width: 1.8; }
    .world { fill: #f0ece4; stroke: #b08d57; stroke-width: 1.8; }
    .item  { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #26313f; }
    .blk   { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; font-weight: 700; fill: #8f2020; }
    .arm   { stroke: #012169; stroke-width: 4; stroke-linecap: round; fill: none; }
    .block { fill: #d64545; stroke: #8f2020; stroke-width: 1.4; }
    .table { fill: #eceff4; stroke: #b9c2ce; stroke-width: 1.4; }
    .move  { stroke: #0f766e; stroke-width: 2.2; fill: none; marker-end: url(#a); }
    .movel { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f766e; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #5a6675; }
    .mono  { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; fill: #012169; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>

  <!-- ============ STATE 1 ============ -->
  <rect class="panel" x="24" y="20" width="270" height="290" rx="9"/>
  <text class="hd"   x="46" y="46">1 · Before the grasp</text>
  <text class="step" x="46" y="66">block is a world object</text>

  <rect class="table" x="46" y="176" width="226" height="12"/>
  <rect class="block" x="180" y="146" width="30" height="30" rx="2"/>
  <path class="arm" d="M 70 176 L 92 116 L 140 106"/>
  <line class="arm" x1="140" y1="106" x2="140" y2="122"/>

  <rect class="robot" x="46" y="204" width="108" height="86" rx="6"/>
  <text class="setl" x="100" y="224" text-anchor="middle">robot</text>
  <text class="item" x="100" y="244" text-anchor="middle">links</text>
  <text class="item" x="100" y="262" text-anchor="middle">gripper</text>

  <rect class="world" x="164" y="204" width="108" height="86" rx="6"/>
  <text class="setl" x="218" y="224" text-anchor="middle">world</text>
  <text class="item" x="218" y="244" text-anchor="middle">table</text>
  <text class="blk"  x="218" y="262" text-anchor="middle">block_1</text>

  <!-- ============ STATE 2 ============ -->
  <rect class="panel" x="314" y="20" width="270" height="290" rx="9"/>
  <text class="hd"   x="336" y="46">2 · After attach</text>
  <text class="step" x="336" y="66">attach_collision_object</text>

  <rect class="table" x="336" y="176" width="226" height="12"/>
  <path class="arm" d="M 360 176 L 388 110 L 440 96"/>
  <line class="arm" x1="440" y1="96" x2="440" y2="112"/>
  <rect class="block" x="425" y="112" width="30" height="30" rx="2"/>

  <rect class="robot" x="336" y="204" width="108" height="86" rx="6"/>
  <text class="setl" x="390" y="224" text-anchor="middle">robot</text>
  <text class="item" x="390" y="244" text-anchor="middle">links + gripper</text>
  <text class="blk"  x="390" y="262" text-anchor="middle">block_1</text>

  <rect class="world" x="454" y="204" width="108" height="86" rx="6"/>
  <text class="setl" x="508" y="224" text-anchor="middle">world</text>
  <text class="item" x="508" y="244" text-anchor="middle">table</text>

  <!-- ============ STATE 3 ============ -->
  <rect class="panel" x="604" y="20" width="270" height="290" rx="9"/>
  <text class="hd"   x="626" y="46">3 · After detach</text>
  <text class="step" x="626" y="66">detach_collision_object</text>

  <rect class="table" x="626" y="176" width="226" height="12"/>
  <rect class="block" x="800" y="146" width="30" height="30" rx="2"/>
  <path class="arm" d="M 650 176 L 678 110 L 730 100"/>
  <line class="arm" x1="730" y1="100" x2="730" y2="116"/>

  <rect class="robot" x="626" y="204" width="108" height="86" rx="6"/>
  <text class="setl" x="680" y="224" text-anchor="middle">robot</text>
  <text class="item" x="680" y="244" text-anchor="middle">links</text>
  <text class="item" x="680" y="262" text-anchor="middle">gripper</text>

  <rect class="world" x="744" y="204" width="108" height="86" rx="6"/>
  <text class="setl" x="798" y="224" text-anchor="middle">world</text>
  <text class="item" x="798" y="244" text-anchor="middle">table</text>
  <text class="blk"  x="798" y="262" text-anchor="middle">block_1</text>

  <!-- transitions -->
  <line class="move" x1="294" y1="240" x2="310" y2="240"/>
  <line class="move" x1="584" y1="240" x2="600" y2="240"/>

  <!-- notes -->
  <line x1="24" y1="336" x2="876" y2="336" stroke="#cdd6e4" stroke-width="1.5"/>

  <text class="note" x="24" y="362">Attaching does not move the arm. It moves the block from one list to the other, and that changes what counts as a collision:</text>
  <text class="note" x="24" y="382">the gripper may now touch the block, but the block must still stay clear of the table and everything else.</text>

  <text class="note" x="24" y="412">Forget the attach and the planner thinks the gripper is empty, and it will sweep the held block through the table.</text>
  <text class="note" x="24" y="432">Forget the detach and the block stays welded to the gripper for the rest of the run, even after you open it.</text>
</svg>
