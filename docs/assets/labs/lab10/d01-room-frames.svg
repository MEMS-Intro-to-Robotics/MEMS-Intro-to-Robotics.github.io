<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img" aria-labelledby="t d">
  <title id="t">The Garage Labs in the simulation, with the world and map frames</title>
  <desc id="d">Top view of Wilkinson 129/133, the Garage Labs, drawn to scale with north up. The lobby wall is at the top and the patio wall along the bottom. A row of storage cages runs down the middle from the lobby, with tool room 129A, orange, below it; the tool room has a closed door in its west and east walls. Benches fill both sides, the robot cell is in the southwest corner, and four columns stand in the room. The world frame has its origin at the center of the room, x pointing east and y north. The robot starts at world (-4.2, -2.95), just west of the tool room&#8217;s west door, facing west. The map frame starts at the robot: map x points west and map y points south. The point world (-4.2, -5.4), south of the tool room&#8217;s southwest corner, is map (0, 2.45). The east-door goal is at world (4.2, -2.95).</desc>
